<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAcción - Contacto</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌱 EcoAcción</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center text-success mb-5 fw-bold">Ponte en Contacto</h2>
        
        <div class="row g-5">
            <!-- Datos de Contacto -->
            <div class="col-md-5">
                <div class="p-4 bg-light rounded border shadow-sm">
                    <h4 class="text-secondary mb-3">Nuestra Sede</h4>
                    <p class="mb-2"><strong>📍 Dirección:</strong> Av. Sostenibilidad Ambiental #456</p>
                    <p class="mb-2"><strong>📞 Teléfono:</strong> +1 800 123 4567</p>
                    <p class="mb-0"><strong>✉️ Correo:</strong> contacto@ecoaccionficticia.org</p>
                </div>
            </div>

            <!-- Formulario Completo exigido -->
            <div class="col-md-7">
                <form class="p-4 border rounded shadow-sm bg-white">
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-medium">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required placeholder="Tu nombre completo">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email</label>
                        <input type="email" class="form-control" id="email" required placeholder="nombre@correo.com">
                    </div>
                    <div class="mb-3">
                        <label for="comentario" class="form-label fw-medium">Comentario</label>
                        <textarea class="form-control" id="comentario" rows="4" required placeholder="Escribe tu consulta aquí..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">Enviar Información</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 EcoAcción. Proyecto educativo para Code Club Accenture.</p>
        </div>
    </footer>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
